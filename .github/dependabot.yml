version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    rebase-strategy: auto
    ignore:
      # Pinned for Bonsai ES 7 — any newer version breaks
      - dependency-name: "@elastic/elasticsearch"
      # @types/node majors track Node majors — pin to .nvmrc; bump manually on Node upgrade
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    rebase-strategy: auto
